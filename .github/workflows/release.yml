name: release

# Every pull request builds the game and the host tools as a check. A push to
# main (a direct commit or a merged pull request) also publishes a GitHub
# Release named after VERSION, whose asset is a self-contained "everything you
# need to build the ROMs" archive: the compiled game with its media already
# converted (soundfont, boot logo, menu backgrounds) and the host tools for
# Windows and Linux. Drop in your own Duke Nukem 3D files, then run build.cmd /
# tools/pack_rom.py -- no Docker, no N64 toolchain required.
#
# The v<VERSION> Release is the latest build of that version: a push that
# does not change VERSION moves the tag to its commit and replaces the asset,
# so that the tag, the code and the binaries always match.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Only the release job writes (see its permissions).
permissions:
  contents: read

# One run per branch at a time; a pull request's new push cancels its old run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The mips64-elf toolchain ($N64_INST), as a Docker image in this
  # repository's packages, built from the libdragon submodule's own Dockerfile
  # and named after its toolchain files: built once per libdragon update (that
  # takes a while: it compiles GCC), checked for and reused otherwise. (There
  # is no public libdragon image to pull: ghcr.io/dragonminded/libdragon is
  # gone, and ghcr.io/n64brew/libdragon is not public.)
  toolchain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Image name
        id: name
        run: |
          KEY="$(git -C libdragon rev-parse HEAD:Dockerfile HEAD:tools/build-toolchain.sh HEAD:tools/build-gdb.sh |
                 sha256sum | cut -c1-16)"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/n64dukenukem3dport-toolchain:${KEY}" >> "$GITHUB_OUTPUT"

      - name: Log in to the container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Already built?
        id: have
        run: |
          if docker manifest inspect "${{ steps.name.outputs.image }}" > /dev/null 2>&1; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push the toolchain image
        if: steps.have.outputs.built != 'true'
        run: |
          docker buildx create --use
          docker buildx build --push -t "${{ steps.name.outputs.image }}" libdragon

  bundle:
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      # mips64-elf toolchain + $N64_INST (see the toolchain job). The library
      # itself is built from the libdragon submodule.
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      asset: ${{ steps.stage.outputs.asset }}

    steps:
      - name: Install packaging deps
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends zip rsync git ca-certificates python3 \
            gcc g++ gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Version
        id: ver
        run: |
          VER="$(tr -d ' \r\n' < VERSION)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER"    >> "$GITHUB_OUTPUT"

      - name: Host tests (save filesystem, sound file parsers)
        run: make -C tests/host

      - name: Patch libdragon
        run: |
          for p in patches/libdragon-*.patch; do
            git -C libdragon apply --verbose "../$p"
          done

      - name: Build libdragon (pinned submodule) + game
        run: |
          make -C libdragon -j"$(nproc)" install
          # The library `install` target doesn't build the host tools; `make
          # engine` needs n64sym + n64elfcompress, mksprite (boot logo, menu
          # backgrounds) and audioconv64 (soundfont).
          make -C libdragon/tools -j"$(nproc)" n64sym-install n64elfcompress-install \
            mksprite-install audioconv64-install
          make -j"$(nproc)" engine
          ls -lR build/prebuilt

      - name: Build the host tools (Linux + Windows)
        run: |
          mkdir -p hosttools/linux hosttools/windows
          bash tools/vendor/bin/build-tools.sh
          mv tools/vendor/bin/n64tool tools/vendor/bin/mkdfs tools/vendor/bin/ed64romconfig tools/vendor/bin/audioconv64 hosttools/linux/
          CC=x86_64-w64-mingw32-gcc CXX=x86_64-w64-mingw32-g++ bash tools/vendor/bin/build-tools.sh
          mv tools/vendor/bin/*.exe hosttools/windows/
          ls -l hosttools/*

      - name: Check the packer
        run: python3 tools/pack_rom.py --help

      - name: Stage the bundle
        id: stage
        run: |
          set -eu
          NAME="N64DukeNukem3DPort-${{ steps.ver.outputs.version }}"
          DEST="stage/$NAME"
          mkdir -p "$DEST"
          # exactly the tracked source (the git-ignored game data is excluded
          # by definition), without the libdragon sources: the bundle is for
          # packing ROMs, building from source needs a clone
          git ls-files -z | rsync -a --files-from=- --from0 ./ "$DEST/"
          # the CI-built binaries the packer needs
          cp -r build/prebuilt/. "$DEST/tools/vendor/engine/"
          cp hosttools/linux/* hosttools/windows/* "$DEST/tools/vendor/bin/"
          # provenance
          {
            echo "N64DukeNukem3DPort ${{ steps.ver.outputs.version }}"
            echo "commit:  ${GITHUB_SHA}"
            echo "ref:     ${GITHUB_REF}"
            echo "run:     ${GITHUB_RUN_NUMBER}"
            echo "built:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$DEST/BUILD_INFO.txt"
          ( cd stage && zip -qr "../$NAME.zip" "$NAME" )
          ls -l "$NAME.zip"
          echo "asset=$NAME.zip" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.stage.outputs.asset }}
          path: ${{ steps.stage.outputs.asset }}
          retention-days: 14

  release:
    needs: bundle
    # Pushes to the main branch, or a manual run on it: never pull requests
    # nor other branches.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Point v${{ needs.bundle.outputs.version }} at this commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.bundle.outputs.tag }}
        run: |
          # The commit the tag points to, if it exists (any kind of tag). (A
          # missing tag is an HTTP error whose JSON gh prints on stdout: only
          # a successful call that gives a SHA counts.)
          if ! SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/refs/tags/${TAG}" --jq .sha 2>/dev/null)" ||
             ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            SHA=""
          fi
          if [ -z "$SHA" ] || [ "$SHA" = "$GITHUB_SHA" ]; then
            # New version (the release action creates the tag here), or a
            # re-run of the same commit.
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only forwards: a re-run of an older commit must not take the
          # release back.
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${SHA}...${GITHUB_SHA}" --jq .status)"
          if [ "$STATUS" != "ahead" ]; then
            echo "::warning title=Release not updated::${TAG} is at ${SHA}, which this commit does not follow (${STATUS})."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true --silent
          echo "Moved ${TAG}: ${SHA} -> ${GITHUB_SHA}"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the bundle
        if: steps.tag.outputs.publish == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.bundle.outputs.asset }}

      - name: Publish release
        if: steps.tag.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.bundle.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: N64DukeNukem3DPort ${{ needs.bundle.outputs.version }}
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: true             # the same asset name for every build of a version
          generate_release_notes: true      # (only when the release is created)
          files: ${{ needs.bundle.outputs.asset }}
